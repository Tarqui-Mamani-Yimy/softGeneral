# Local development only. The database port is bound to 127.0.0.1 so it is
# never reachable from other machines.
name: softgeneral

services:
  db:
    image: postgres:17-alpine
    container_name: softgeneral-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    container_name: softgeneral-mediamtx
    restart: unless-stopped
    profiles:
      - camera-sim
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8889:8889/udp"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9997:9997"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

volumes:
  db_data:
